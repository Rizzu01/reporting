name: Fix Friday task dates and tracker scroll

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: Friday task dates and tracker scroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch date handling and tracker scroll
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace(
              'const today = new Date().toISOString().slice(0, 10);',
              'function dateKey(d: Date) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }\nconst today = dateKey(new Date());'
          )
          s = s.replace(
              'function getWeekStart(date: string) { const d = new Date(`${date}T00:00:00`); const day = d.getDay(); d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); return d.toISOString().slice(0, 10); }',
              'function getWeekStart(date: string) { const [y, m, dayValue] = date.split("-").map(Number); const d = new Date(y, m - 1, dayValue); const day = d.getDay(); d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); return dateKey(d); }'
          )
          s = s.replace(
              'function getWeekDates(date: string) { const start = new Date(`${getWeekStart(date)}T00:00:00`); return Array.from({ length: 6 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d.toISOString().slice(0, 10); }); }',
              'function getWeekDates(date: string) { const [y, m, dayValue] = getWeekStart(date).split("-").map(Number); const start = new Date(y, m - 1, dayValue); return Array.from({ length: 6 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return dateKey(d); }); }'
          )
          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          marker = '.tracker-panel {\n  min-height: 430px\n}'
          replacement = '''.tracker-panel {\n  min-height: 430px;\n  max-height: 650px;\n  overflow: hidden\n}\n\n.tracker-panel .day-list {\n  max-height: 555px;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding-right: 5px;\n  scrollbar-width: thin;\n  scrollbar-color: #cfc9f8 transparent\n}\n\n.tracker-panel .day-list::-webkit-scrollbar {\n  width: 6px\n}\n\n.tracker-panel .day-list::-webkit-scrollbar-track {\n  background: transparent\n}\n\n.tracker-panel .day-list::-webkit-scrollbar-thumb {\n  background: #d2ccf7;\n  border-radius: 10px\n}\n\n.tracker-panel .day-list::-webkit-scrollbar-thumb:hover {\n  background: #b8aff0\n}\n\n@media(max-width:900px) {\n  .tracker-panel { max-height: 620px }\n  .tracker-panel .day-list { max-height: 525px }\n}\n\n@media(max-width:560px) {\n  .tracker-panel { max-height: 560px }\n  .tracker-panel .day-list { max-height: 465px }\n}'''
          if marker not in c:
              raise SystemExit('tracker CSS marker not found')
          css.write_text(c.replace(marker, replacement))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "fix: Friday task dates and tracker scroll" || exit 0
          git push
