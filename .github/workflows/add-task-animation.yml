name: Add subtle task animation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-animation:
    if: github.event.head_commit.message != 'fix: add subtle task animation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add animation CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/globals.css')
          s = p.read_text()
          marker = '.task-card{\n  display: flex;'
          if marker not in s:
              raise SystemExit('task-card marker not found')
          extra = '''.task-card {\n  animation: taskCardIn .28s ease-out both;\n}\n\n@keyframes taskCardIn {\n  from { opacity: 0; transform: translateY(5px) scale(.99); }\n  to { opacity: 1; transform: translateY(0) scale(1); }\n}\n\n.form-stack .dark-btn:active {\n  transform: scale(.985);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .task-card { animation: none; }\n}\n\n'''
          p.write_text(s.replace(marker, extra + marker))
          PY
      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "fix: add subtle task animation" || exit 0
          git push
